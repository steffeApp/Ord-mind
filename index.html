<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>Ordspel</title>

  <link rel="icon" type="image/png" href="./icon-180.png?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png?v=3">

  <style>
body{
  margin:0;
  background:#121213;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  text-align:center;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  min-height:100vh;
  -webkit-text-size-adjust:100%;
}

.top-container{
  padding-top:12px;
}

h1{
  margin:0;
  font-size:34px;
  font-weight:800;
  letter-spacing:2px;
  text-transform:uppercase;
}

#stats{
  margin-top:10px;
  font-size:18px;
  font-weight:600;
  color:#d7d7d7;
}

.main-container{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:4px 0;
}

#board{
  display:grid;
  grid-template-columns:repeat(5, 58px);
  grid-template-rows:repeat(6, 58px);
  gap:8px;
  justify-content:center;
  margin:14px auto 8px;
}

.tile{
  width:100%;
  height:100%;
  border:2px solid #3a3a3c;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:700;
  text-transform:uppercase;
  box-sizing:border-box;
}

.correct{
  background:#538d4e;
  border-color:#538d4e;
}

.present{
  background:#b59f3b;
  border-color:#b59f3b;
}

.absent{
  background:#3a3a3c;
  border-color:#3a3a3c;
}

#message{
  min-height:24px;
  margin-top:14px;
  font-size:16px;
  font-weight:700;
}

.bottom-container{
  padding:
    8px
    10px
    calc(env(safe-area-inset-bottom) + 10px);
}

#keyboard{
  width:100%;
  max-width:100vw;
  padding:0 8px;
  box-sizing:border-box;
}

.keyboard-row{
  display:flex;
  justify-content:center;
  gap:6px;
  margin-bottom:6px;
  width:100%;
}

.key{
  flex:1;
  min-width:0;
  max-width:42px;
  height:52px;
  border:none;
  border-radius:10px;
  background:#818384;
  color:white;
  font-size:20px;
  font-weight:700;
  box-sizing:border-box;

  -webkit-user-select:none;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}

.key.wide{
  flex:1.4;
}

.key.correct{
  background:#538d4e !important;
}

.key.present{
  background:#b59f3b !important;
}

.key.absent{
  background:#3a3a3c !important;
}

#guessBtn{
  margin-top:8px;
  margin-bottom:6px;
  width:min(82vw,320px);
  height:50px;
  border:none;
  border-radius:999px;
  background:#538d4e;
  color:white;
  font-size:18px;
  font-weight:800;
}

#helpModal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.84);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
}

#helpBox{
  background:#1f1f1f;
  max-width:320px;
  padding:24px;
  border-radius:18px;
  color:white;
}

#helpBox button{
  margin-top:16px;
  border:none;
  background:#538d4e;
  color:white;
  padding:12px 18px;
  border-radius:10px;
}
</style>
</head>
<body>

  <div class="top-container">
    <h1>Ordspel</h1>
    <div id="stats"></div>
  </div>

  <div class="main-container">
    <div id="board"></div>
    <div id="message"></div>
  </div>

  <div class="bottom-container">
    <div id="keyboard"></div>
    <button id="guessBtn">GISSA</button>
  </div>

  <div id="helpModal">
    <div id="helpBox">
      <h2>Så spelar du</h2>
      <p>🎯 Gissa ordet på <strong>5 bokstäver</strong></p>
      <p>Du har <strong>6 försök</strong>.</p>
      <p>Efter varje gissning får bokstäverna färg:</p>
      <p>🟩 = rätt bokstav på rätt plats</p>
      <p>🟨 = rätt bokstav men på fel plats</p>
      <p>⬛ = bokstaven finns inte i ordet</p>
      <button onclick="closeHelp()">Jag fattar 👍</button>
    </div>
  </div>

  <script src="script.js?v=5"></script>

</body>
</html>
