<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>Ordspel</title>

  <link rel="icon" type="image/png" href="./icon-180.png?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png?v=3">

  <style>
/* PREMIUM APP LAYOUT */
body {
  margin: 0;
  padding: 0;
  background: #121213;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  text-align: center;
  overflow: hidden;
  touch-action: none; 
  -webkit-text-size-adjust: 100%;
  display: flex;
  flex-direction: column;
  height: 100vh;
  justify-content: space-between;
  box-sizing: border-box;
}

/* TOPPMENY */
.top-container {
  flex: 0 0 auto;
  width: 100%;
}

h1 {
  margin: 0;
  padding: 12px 0 8px;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  border-bottom: 1px solid #3a3a3c;
}

#stats {
  margin: 8px 0 0;
  font-size: 14px;
  color: #b8b8b8;
  letter-spacing: 0.5px;
}

/* SPELPLAN (MITTENPLATS) */
.main-container {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 10px 0;
}

/* FIX: Sätter fasta, responsiva proportioner på kolumner OCH rader för att krossa Safari-buggen */
#board {
  display: grid;
  grid-template-columns: repeat(5, min(16vw, 62px));
  grid-auto-rows: min(16vw, 62px);
  gap: 6px;
  justify-content: center;
}

/* FIX: Rutorna blir nu garanterat kvadratiska och bokstäverna är stora och kaxiga */
.tile {
  width: 100%;
  height: 100%;
  border: 2px solid #3a3a3c;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 28px; 
  font-weight: 700;
  text-transform: uppercase;
  border-radius: 4px;
  box-sizing: border-box;
}

.correct {
  background: #538d4e;
  border-color: #538d4e;
  color: white;
}

.present {
  background: #b59f3b;
  border-color: #b59f3b;
  color: white;
}

.absent {
  background: #3a3a3c;
  border-color: #3a3a3c;
  color: white;
}

#message {
  margin-top: 14px;
  min-height: 20px;
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 0.5px;
}

/* TANGENTBORD & KNAPPAR (BOTTENPLATS) */
.bottom-container {
  flex: 0 0 auto;
  width: 100%;
  padding-bottom: env(safe-area-inset-bottom, 12px); 
  display: flex;
  flex-direction: column;
  align-items: center;
}

#keyboard {
  width: 100%;
  max-width: 480px;
  padding: 0 8px;
  box-sizing: border-box;
}

.keyboard-row {
  display: flex;
  justify-content: center;
  gap: 5px;
  margin-bottom: 6px;
  width: 100%;
}

.key {
  flex: 1;
  height: 58px; 
  border: none;
  border-radius: 4px;
  background: #818384;
  color: white;
  font-size: 18px;
  font-weight: bold;
  display: flex;
  justify-content: center;
  align-items: center;
  -webkit-user-select: none; 
  user-select: none;
  min-width: 0; 
}

.key.wide {
  flex: 1.5;
}

.key.correct {
  background: #538d4e !important;
}

.key.present {
  background: #b59f3b !important;
}

.key.absent {
  background: #3a3a3c !important;
}

#guessBtn {
  margin: 6px 0 8px;
  border: none;
  background: #538d4e;
  color: white;
  padding: 12px 45px;
  font-size: 16px;
  font-weight: bold;
  border-radius: 25px;
  letter-spacing: 1px;
  text-transform: uppercase;
  box-shadow: 0 4px 6px rgba(0,0,0,0.2);
  -webkit-user-select: none;
  user-select: none;
}

/* HJÄLPMENY */
#helpModal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.85);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 999;
}

#helpBox {
  background: #1f1f1f;
  color: white;
  max-width: 320px;
  padding: 24px;
  border-radius: 14px;
  text-align: center;
}

#helpBox button {
  margin-top: 16px;
  background: #538d4e;
  border: none;
  color: white;
  padding: 12px 18px;
  border-radius: 8px;
}
</style>
</head>
<body>

  <div class="top-container">
    <h1>Ordspel</h1>
    <div id="stats"></div>
  </div>

  <div class="main-container">
    <div id="board"></div>
    <div id="message"></div>
  </div>

  <div class="bottom-container">
    <div id="keyboard"></div>
    <button id="guessBtn">GISSA</button>
  </div>

  <div id="helpModal">
    <div id="helpBox">
      <h2>Så spelar du</h2>
      <p>🎯 Gissa ordet på <strong>5 bokstäver</strong></p>
      <p>Du har <strong>6 försök</strong>.</p>
      <p>Efter varje gissning får bokstäverna färg:</p>
      <p>🟩 = rätt bokstav på rätt plats</p>
      <p>🟨 = rätt bokstav men på fel plats</p>
      <p>⬛ = bokstaven finns inte i ordet</p>
      <button onclick="closeHelp()">Jag fattar 👍</button>
    </div>
  </div>

  <script src="script.js?v=5"></script>

</body>
</html>
