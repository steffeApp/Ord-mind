<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ordspel</title>

  <link rel="icon" type="image/png" href="./icon-180.png?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png?v=3">

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #121213;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 32px;
    }

    #stats {
      margin-bottom: 18px;
      font-size: 18px;
      font-weight: bold;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(5, 62px);
      gap: 6px;
      justify-content: center;
      margin: 20px auto;
    }

    .tile {
      width: 62px;
      height: 62px;
      border: 2px solid #3a3a3c;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 32px;
      font-weight: bold;
      text-transform: uppercase;
      border-radius: 6px;
      box-sizing: border-box;
    }

    .correct {
      background-color: #538d4e;
      border-color: #538d4e;
      color: white;
    }

    .present {
      background-color: #b59f3b;
      border-color: #b59f3b;
      color: white;
    }

    .absent {
      background-color: #3a3a3c;
      border-color: #3a3a3c;
      color: white;
    }

    #keyboard {
      max-width: 560px;
      margin: 28px auto 10px;
    }

    .keyboard-row {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 6px;
      flex-wrap: nowrap;
    }

    .key {
      min-width: 40px;
      height: 54px;
      border: none;
      border-radius: 6px;
      background-color: #818384;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      padding: 0 8px;
    }

    .key.wide {
      min-width: 64px;
    }

    /* Viktig fix för tangentbordets färger */
    .key.correct {
      background-color: #538d4e !important;
    }

    .key.present {
      background-color: #b59f3b !important;
    }

    .key.absent {
      background-color: #3a3a3c !important;
    }

    #guessBtn {
      margin-top: 14px;
      border: none;
      background-color: #538d4e;
      color: white;
      padding: 14px 24px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }

    #message {
      margin-top: 16px;
      min-height: 28px;
      font-size: 18px;
      font-weight: bold;
    }
    #helpModal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.82);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 999;
}

#helpBox {
  background: #1f1f1f;
  color: white;
  max-width: 320px;
  padding: 24px;
  border-radius: 14px;
  text-align: center;
}

#helpBox h2{
  margin-top:0;
}

#helpBox button{
  margin-top:16px;
  background:#538d4e;
  border:none;
  color:white;
  padding:12px 18px;
  border-radius:8px;
  font-size:16px;
  cursor:pointer;
}
  </style>
</head>
<body>

  <h1>Ordspel</h1>

  <div id="stats"></div>

  <div id="board"></div>

  <div id="keyboard"></div>

  <button id="guessBtn">GISSA</button>

  <div id="message"></div>
<div id="helpModal">
  <div id="helpBox">
    <h2>Så spelar du</h2>

    <p>🎯 Gissa ordet på <strong>5 bokstäver</strong></p>
    <p>Du har <strong>6 försök</strong>.</p>

    <p>Efter varje gissning får bokstäverna färg:</p>

    <p>🟩 = rätt bokstav på rätt plats</p>
    <p>🟨 = rätt bokstav men på fel plats</p>
    <p>⬛ = bokstaven finns inte i ordet</p>

    <button onclick="closeHelp()">Jag fattar 👍</button>
  </div>
</div>
  <script src="script.js"></script>

</body>
</html>
