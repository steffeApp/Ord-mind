<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Ordspel</title>

  <link rel="icon" type="image/png" href="./icon-180.png?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png?v=3">

  <style>
body{
  margin:0;
  padding:10px 10px 18px;
  background:#121213;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  overflow:hidden;
  touch-action: none; /* Stänger av alla webbläsargester på hela sidan */
  -webkit-text-size-adjust:100%;
}

h1{
  margin:10px 0 6px;
  font-size:32px;
}

#stats{
  margin-bottom:12px;
  font-size:18px;
  font-weight:bold;
}

#board{
  display:grid;
  grid-template-columns:repeat(5, min(17vw, 58px));
  gap:6px;
  justify-content:center;
  margin:12px auto;
}

.tile{
  width:min(17vw, 58px);
  height:min(17vw, 58px);
  border:2px solid #3a3a3c;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:28px;
  font-weight:bold;
  text-transform:uppercase;
  border-radius:6px;
  box-sizing:border-box;
}

.correct{
  background:#538d4e;
  border-color:#538d4e;
  color:white;
}

.present{
  background:#b59f3b;
  border-color:#b59f3b;
  color:white;
}

.absent{
  background:#3a3a3c;
  border-color:#3a3a3c;
  color:white;
}

#keyboard{
  max-width:560px;
  margin:16px auto 8px;
}

.keyboard-row{
  display:flex;
  justify-content:center;
  gap:5px;
  margin-bottom:5px;
}

.key{
  min-width:32px;
  height:48px;
  border:none;
  border-radius:6px;
  background:#818384;
  color:white;
  font-size:18px;
  font-weight:bold;
  padding:0 6px;
  /* FIX: Hindrar iOS från att markera text/frysa knappen vid snabba tryck */
  -webkit-user-select: none; 
  user-select: none;
}

.key.wide{
  min-width:54px;
}

.key.correct{
  background:#538d4e !important;
}

.key.present{
  background:#b59f3b !important;
}

.key.absent{
  background:#3a3a3c !important;
}

#guessBtn{
  margin-top:10px;
  margin-bottom:8px;
  border:none;
  background:#538d4e;
  color:white;
  padding:12px 22px;
  font-size:18px;
  font-weight:bold;
  border-radius:8px;
  /* FIX: Samma här för gissa-knappen */
  -webkit-user-select: none;
  user-select: none;
}

#message{
  margin-top:10px;
  min-height:24px;
  font-size:18px;
  font-weight:bold;
}

#helpModal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.82);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
}

#helpBox{
  background:#1f1f1f;
  color:white;
  max-width:320px;
  padding:24px;
  border-radius:14px;
  text-align:center;
}

#helpBox button{
  margin-top:16px;
  background:#538d4e;
  border:none;
  color:white;
  padding:12px 18px;
  border-radius:8px;
}
</style>
</head>
<body>

  <h1>Ordspel</h1>

  <div id="stats"></div>

  <div id="board"></div>

  <div id="keyboard"></div>

  <button id="guessBtn">GISSA</button>

  <div id="message"></div>
<div id="helpModal">
  <div id="helpBox">
    <h2>Så spelar du</h2>

    <p>🎯 Gissa ordet på <strong>5 bokstäver</strong></p>
    <p>Du har <strong>6 försök</strong>.</p>

    <p>Efter varje gissning får bokstäverna färg:</p>

    <p>🟩 = rätt bokstav på rätt plats</p>
    <p>🟨 = rätt bokstav men på fel plats</p>
    <p>⬛ = bokstaven finns inte i ordet</p>

    <button onclick="closeHelp()">Jag fattar 👍</button>
  </div>
</div>
  <script src="script.js?v=2"></script>

</body>
</html>
